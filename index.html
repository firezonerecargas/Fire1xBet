// ===== JUEGOS =====
const SY=['🍒','🍋','🔔','⭐','💎','7️⃣'];
const INFO={slots:'Prob. de ganar ~39% · 3 iguales x10 (2.5%) · 2 iguales x1.5 (36.7%)',tragaperras:'Prob. de ganar ~39% · 3 iguales x10 (2.5%) · 2 iguales x1.5 (36.7%)',crash:'Tu prob. de ganar = 80% ÷ el multiplicador (ej. x2 → 40%)',bingo:'12 bolas de 75 · prob. 16% · si sale tu número paga x5',caza:'Prob. de ganar 30% · paga x2.7',scratch:'3 💎 paga x5 (7%) · 3 ⭐ paga x1.8 (22%)',keno:'Más aciertos, más premio (hasta x9). Con pocos aciertos recuperas solo una parte',penal:'GOL sale 45% y paga x1.8 · NO GOL sale 55% y paga x1.45'};
function openG(id){const g=S.games.find(x=>x.id==id);S.g=id;S.pick=[];
const pk={crash:'<input id="pk" type="number" step="0.1" min="1.1" value="2" placeholder="Retirar en (x)">',bingo:'<input id="pk" type="number" min="1" max="75" placeholder="Tu número (1-75)">',
caza:'<p class="mu">Elige tu objetivo</p><div class="pk">'+['🐟','🦆','🐗'].map((e,i)=>`<button onclick="pickOne(${i+1},this)">${e}</button>`).join('')+'</div>',
penal:'<p class="mu">¿Será gol o no gol?</p><div class="pk"><button style="font-size:16px" onclick="pickOne(1,this)">⚽ GOL</button><button style="font-size:16px" onclick="pickOne(0,this)">🧤 NO GOL</button></div>',
keno:'<p class="mu">Elige de 4 a 10 números</p><div class="kn">'+Array.from({length:80},(_,i)=>`<button onclick="kn(${i+1},this)">${i+1}</button>`).join('')+'</div>'}[id]||'';
const m=document.createElement('div');m.className='modal';m.id='md';
m.innerHTML=`<div id="mb"><h3>${g.emoji} ${esc(g.name)} <a href="#" style="float:right;text-decoration:none" onclick="$('md').remove();return false">✕</a></h3><div class="mu">Saldo: <b id="sb" style="color:var(--f3)">${f2(S.p.balance)}</b> USDT</div><p class="mu">${INFO[id]||''}</p>${pk}<input id="bet" type="number" step="0.1" min="0.5" value="0.5" placeholder="Apuesta (mín. 0.5)"><div class="res" id="rs"><span class="idle">${g.emoji}</span></div><div class="msg" id="msg"></div><button class="b" style="width:100%" id="pb" onclick="play()">🔥 Jugar</button></div>`;document.body.appendChild(m)}
function pickOne(v,el){S.pick=[v];el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');sfx('tick')}
function kn(n,el){const i=S.pick.indexOf(n);if(i>=0){S.pick.splice(i,1);el.classList.remove('sel')}else if(S.pick.length<10){S.pick.push(n);el.classList.add('sel');sfx('tick')}}
async function anim(g,d,m){const R=$('rs'),pv=S.pick[0];
if(g=='slots'||g=='tragaperras'){R.innerHTML='<div class="reels">'+[0,1,2].map(i=>`<div class="reel spin" id="r${i}">🎰</div>`).join('')+'</div>';
const iv=setInterval(()=>[0,1,2].forEach(i=>{const e=$('r'+i);if(e&&e.classList.contains('spin'))e.textContent=SY[Math.random()*6|0]}),80);
for(let i=0;i<3;i++){await sleep(800+i*550);const e=$('r'+i);if(!e)break;e.classList.remove('spin');e.textContent=SY[d[i]-1];e.classList.add('stop');sfx('tick')}clearInterval(iv)}
else if(g=='crash'){R.innerHTML='<div class="cr"><div class="rk" id="rk">🚀</div><div class="mx" id="mx">1.00x</div></div>';const T=d.crash,t0=performance.now(),dur=Math.min(1300+T*500,4200);
await new Promise(res=>{(function st(t){const k=Math.min((t-t0)/dur,1),v=1+(T-1)*k*k,mx=$('mx');if(!mx)return res();mx.textContent=f2(v)+'x';$('rk').style.transform=`translate(${k*230}px,${-k*70}px) rotate(-${15+k*20}deg)`;if(k<1)requestAnimationFrame(st);else res()})(t0)});
const mx=$('mx');if(mx){mx.textContent='💥 '+T+'x';mx.style.color='var(--no)'}}
else if(g=='bingo'){R.innerHTML='<div class="balls" id="bl"></div>';const mine=+$('pk').value;for(const n of d){const e=$('bl');if(!e)return;e.insertAdjacentHTML('beforeend',`<span class="ball ${n==mine?'hit':''}">${n}</span>`);sfx('tick');await sleep(190)}}
else if(g=='caza'){const T=['🐟','🦆','🐗'];R.innerHTML='<div class="reels">'+T.map((e,i)=>`<div class="reel spin" id="z${i}">${e}</div>`).join('')+'</div>';await sleep(1400);
T.forEach((e,i)=>{const z=$('z'+i);if(!z)return;z.classList.remove('spin');if(i==d-1){z.classList.add('stop');z.style.boxShadow='0 0 24px var(--f2)';z.textContent=e+'🎯'}else z.style.opacity=.3})}
else if(g=='scratch'){const c=m==5?'💎':m>0?'⭐':null,cells=c?[c,c,c]:['🍒','🍋','🔔'];R.innerHTML='<div class="reels">'+cells.map((x,i)=>`<div class="reel" id="s${i}" style="background:linear-gradient(135deg,#aaa,#eee,#aaa)">❓</div>`).join('')+'</div>';
for(let i=0;i<3;i++){await sleep(650);const e=$('s'+i);if(!e)return;e.style.background='#fff';e.textContent=cells[i];e.classList.add('flip');sfx('tick')}}
else if(g=='keno'){document.querySelectorAll('.kn button').forEach(b=>b.classList.remove('hit','miss'));R.innerHTML='<div class="mu" style="font-size:14px">Sorteando…</div>';
for(const n of d){const b=document.querySelectorAll('.kn button')[n-1];if(!b)return;const h=S.pick.includes(n);b.classList.add(h?'hit':'miss');if(h)sfx('tick');await sleep(130)}
R.innerHTML=`<div style="font-size:20px">🎯 ${S.pick.filter(x=>d.includes(x)).length} aciertos</div>`}
else if(g=='penal'){const X=[16,50,84];R.innerHTML='<div class="goal"><div class="kp" id="kp">🧤</div><div class="bl" id="bl2">⚽</div></div>';await sleep(500);const kp=$('kp'),bl=$('bl2');if(!kp)return;
const sh=Math.random()*3|0,kx=d==1?(sh+1+(Math.random()*2|0))%3:sh;kp.style.left=X[kx]+'%';bl.style.left=X[sh]+'%';bl.style.bottom='52px';bl.style.transform='translateX(-50%) scale(.55) rotate(540deg)';await sleep(1100)}}
async function play(){const g=S.g,bet=+$('bet').value;let pick=[...S.pick];
if(g=='crash')pick=[Math.round(+$('pk').value*100)];if(g=='bingo')pick=[+$('pk').value];
if(!(bet>=0.5))return toast('Apuesta mínima 0.5');if(bet>S.p.balance)return toast('Saldo insuficiente');
if(['caza','penal'].includes(g)&&!pick.length)return toast('Elige una opción');if(g=='keno'&&pick.length<4)return toast('Elige al menos 4 números');
const pb=$('pb');pb.disabled=true;$('msg').textContent='';$('msg').className='msg';sfx('go');
const{data,error}=await sb.rpc('play_game',{g,bet,pick});
if(error){pb.disabled=false;return toast(error.message)}
try{await anim(g,data.d,data.mult)}catch(e){}
const w=data.win,msg=$('msg');if(!msg){setBal(data.balance);return}
setBal(data.balance);pb.disabled=false;
if(w){msg.className='msg w';msg.textContent=(g=='penal'?(data.d?'⚽ ¡GOL! ':'🧤 ¡NO GOL! ')+'¡Acertaste! ':'🎉 ¡GANASTE! ')+'x'+data.mult+' → +'+f2(bet*data.mult)+' USDT';boom(data.mult>=5?260:140);sfx('win')}
else{msg.className='msg l';msg.textContent=data.mult>0?'↩️ Recuperas x'+data.mult+' (+'+f2(bet*data.mult)+' USDT)':g=='penal'?(data.d?'⚽ Fue GOL. ':'🧤 Fue NO GOL. ')+'Perdiste':'😔 Perdiste, ¡inténtalo otra vez!';$('mb').classList.remove('shake');void $('mb').offsetWidth;$('mb').classList.add('shake');sfx('lose')}}
// ===== ADMIN =====
async function adminView(t){S.at2=t;const tabs=[['dep','Depósitos'],['ret','Retiros'],['jue','Juegos'],['jug','Jugadores'],['cfg','Ajustes']];let body='';
if(t=='dep'||t=='ret'){const tb=t=='dep'?'deposits':'withdrawals';const{data}=await sb.from(tb).select('*,profiles(name,email)').order('id',{ascending:false});
body=(data||[]).map(x=>`<div class="box"><b>${esc(x.profiles?.name)}</b> <span class="mu">${esc(x.profiles?.email)}</span><br>${f2(x.amount)} USDT · <span class="pill ${x.status}">${x.status}</span><div class="mu" style="word-break:break-all">${esc(t=='dep'?x.hash:x.address)}</div><div class="mu">${fd(x.created_at)}</div>${x.status=='pendiente'?`<button class="b k" onclick="adm('${t}',${x.id},true)">Aceptar</button><button class="b r" onclick="adm('${t}',${x.id},false)">Rechazar</button>`:''}</div>`).join('')||'<p class="mu">Nada por aquí</p>'}
else if(t=='jue'){await loadG();body=S.games.map(g=>`<div class="box row"><span>${g.emoji} ${esc(g.name)}<br><span class="mu">${g.plays} jugadas</span></span><button class="b ${g.enabled?'r':'k'}" onclick="tg('${g.id}',${!g.enabled})">${g.enabled?'Quitar':'Poner disponible'}</button></div>`).join('')}
else if(t=='cfg'){const{data:a}=await sb.from('settings').select('value').eq('key','deposit_address').maybeSingle();body=`<div class="box"><h4>Dirección de depósito (USDT BEP20)</h4><p class="mu">Es la dirección que verán los jugadores al depositar.</p><input id="ad" value="${esc(a?.value)}" placeholder="0x..."><button class="b" onclick="saveAd()">Guardar</button></div>`}
else{const{data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
body=(data||[]).map(u=>`<div class="box"><b>${esc(u.name)}</b> ${u.is_admin?'<span class="pill aprobado">admin</span>':''}${u.banned?'<span class="pill rechazado">baneado</span>':''}<br><span class="mu">${esc(u.email)} · ${fd(u.created_at)}</span><br>Saldo: <b style="color:var(--f3)">${f2(u.balance)} USDT</b><br><button class="b s" onclick="au('${u.id}','admin')">${u.is_admin?'Quitar admin':'Poner administrador'}</button><button class="b r" onclick="au('${u.id}','ban')">${u.banned?'Desbanear':'Banear'}</button></div>`).join('')}
$('m').innerHTML=`<div>${tabs.map(x=>`<button class="b ${t==x[0]?'':'s'}" onclick="adminView('${x[0]}')">${x[1]}</button>`).join('')}</div><br>${body}`}
async function adm(t,id,ok){const{error}=await sb.rpc(t=='dep'?'admin_deposit':'admin_withdraw',{i:id,ok});if(error)toast(error.message);adminView(t)}
async function tg(id,v){await sb.from('games').update({enabled:v}).eq('id',id);adminView('jue')}
async function au(u,act){const{error}=await sb.rpc('admin_user',{u,act});if(error)toast(error.message);adminView('jug')}
async function saveAd(){const v=$('ad').value.trim();if(!/^0x[a-fA-F0-9]{40}$/.test(v))return toast('Dirección BEP20 inválida (0x + 40 caracteres)');const{error}=await sb.rpc('admin_set_setting',{k:'deposit_address',v});toast(error?error.message:'✅ Dirección actualizada')}
boot();
</script></body></html>
